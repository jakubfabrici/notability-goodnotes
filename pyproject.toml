[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnnote"
description = "Convert between GoodNotes (.goodnotes) and Notability (.note) files keeping handwriting editable"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]
keywords = ["goodnotes", "notability", "handwriting", "converter", "ipad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gnnote = "gnnote.cli:main"

[project.urls]
Source = "https://github.com/jakubfabrici/notability-goodnotes"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# the PDF writer's embedded font (DejaVu subset and its licence)
"gnnote.pdf" = ["fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "gnnote.__version__" }

[tool.setuptools.packages.find]
include = ["gnnote*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
