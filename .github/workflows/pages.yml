name: Deploy web UI to GitHub Pages

# Deploys dist/ on every push to main. GitHub Pages has to be switched on once in
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (private
# repositories need a paid GitHub plan for Pages). While it is off, the workflow ends
# with a notice instead of failing, so no failure notification is sent.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check that GitHub Pages is set to deploy from GitHub Actions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not set up::Nothing was deployed. Open Settings -> Pages and choose Source: GitHub Actions (private repositories need a paid plan), then re-run this workflow."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Build dist (web UI + gnnote.zip, Pyodide from the CDN)
        if: steps.check.outputs.enabled == 'true'
        run: python scripts/build_web.py --out dist

      - name: Configure Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dist
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
