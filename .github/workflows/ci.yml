name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install gnnote with test extras
        run: python -m pip install -e ".[test]"

      - name: Cache reference sample repositories
        uses: actions/cache@v4
        with:
          path: tests/.samples
          key: samples-${{ hashFiles('tests/conftest.py') }}

      # The reference repositories are third-party test oracles and sample files, each
      # checked out at the commit pinned in tests/conftest.py so the corpus is the same on
      # every run (the cache key above changes with the pins).  A clone that fails (network,
      # repository gone) only makes the tests that need it skip.
      - name: Clone reference repositories at their pinned commits (test oracles and sample files)
        run: |
          python - <<'EOF'
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from tests.conftest import REPOS, clone_pinned
          root = Path("tests/.samples")
          root.mkdir(parents=True, exist_ok=True)
          for name, (url, sha) in REPOS.items():
              target = root / name
              if target.is_dir():
                  print("present:", name)
                  continue
              try:
                  clone_pinned(target, url, sha)
                  print("cloned:", name, "@", sha[:7])
              except Exception as exc:  # noqa: BLE001
                  shutil.rmtree(target, ignore_errors=True)
                  print("skipped:", name, exc)
          EOF

      - name: Install oracle parser dependencies (parser-for-goodnotes needs numpy)
        run: python -m pip install numpy || echo "numpy unavailable; oracle tests will skip"

      - name: Run tests
        env:
          GNNOTE_SAMPLES: ${{ github.workspace }}/tests/.samples
          # never clone from inside pytest: whatever the step above could not fetch is skipped
          GNNOTE_OFFLINE: "1"
        run: python -m pytest -q

  e2e:
    name: browser end-to-end (Pyodide)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # tests/e2e/run.js resolves the playwright package through NODE_PATH=$(npm root -g);
      # the package must be installed before `npx playwright install` fetches Chromium.
      - name: Install Playwright with Chromium
        run: |
          npm install -g --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      # tests/conftest.py (pinned clone helper) imports pytest at module level
      - name: Install gnnote and pytest
        run: python -m pip install -e ".[test]"

      - name: Fetch sample files (synthetic fallback when the repositories are unreachable)
        run: |
          mkdir -p tests/.samples
          python - <<'EOF'
          # the same pinned commits as the tests job (tests/conftest.py), so the e2e inputs
          # are the files the unit tests were written against
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from tests.conftest import REPOS, clone_pinned
          root = Path("tests/.samples")
          for name in ("goodparse", "notability-to-svg"):
              url, sha = REPOS[name]
              target = root / name
              if target.is_dir():
                  continue
              try:
                  clone_pinned(target, url, sha)
              except Exception as exc:  # noqa: BLE001
                  shutil.rmtree(target, ignore_errors=True)
                  print("skipped:", name, exc)
          EOF
          python - <<'EOF'
          from pathlib import Path
          from gnnote.convert import Options
          from gnnote.goodnotes.writer import write_goodnotes
          from gnnote.model import Document, Page, Point, Stroke
          from gnnote.notability.writer import write_note
          root = Path("tests/.samples")
          gn = sorted((root / "goodparse" / "samples").glob("Test5.goodnotes")) or \
              sorted((root / "goodparse" / "samples").glob("*.goodnotes"))
          nb = root / "notability-to-svg" / "example.note"
          page = Page(455.04, 588.45)
          page.strokes.append(Stroke([Point(30, 30, 2.0), Point(90, 70, 2.0), Point(150, 30, 2.0)], width=2.0))
          doc = Document(title="Synthetic", pages=[page])
          out = root / "e2e"
          out.mkdir(exist_ok=True)
          if gn:
              (out / "input.goodnotes").write_bytes(gn[0].read_bytes())
              print("GoodNotes input:", gn[0])
          else:
              (out / "input.goodnotes").write_bytes(write_goodnotes(doc, Options()))
              print("GoodNotes input: synthetic")
          if nb.is_file():
              (out / "input.note").write_bytes(nb.read_bytes())
              print("Notability input:", nb)
          else:
              (out / "input.note").write_bytes(write_note(doc, Options()))
              print("Notability input: synthetic")
          EOF

      - name: Build dist (CDN Pyodide)
        run: python scripts/build_web.py --out dist --clean

      - name: GoodNotes -> Notability in the browser
        run: |
          NODE_PATH=$(npm root -g) node tests/e2e/run.js --dist dist \
            --input tests/.samples/e2e/input.goodnotes --expect-ext .note --out tests/e2e/out/input.note
          python -m gnnote info tests/e2e/out/input.note

      - name: Notability -> GoodNotes in the browser
        run: |
          NODE_PATH=$(npm root -g) node tests/e2e/run.js --dist dist \
            --input tests/.samples/e2e/input.note --expect-ext .goodnotes --out tests/e2e/out/input.goodnotes
          python -m gnnote info tests/e2e/out/input.goodnotes
